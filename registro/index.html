<!DOCTYPE html>
<html lang="es">

<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta charset="utf-8" />
  <title>Carnicería</title>
  <link href="https://fonts.googleapis.com" rel="preconnect" />
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&amp;display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#d43211",
            "background-light": "#f8f6f6",
            "background-dark": "#221310",
          },
          fontFamily: {
            "display": ["Inter"]
          },
          borderRadius: {
            "DEFAULT": "0.25rem",
            "lg": "0.5rem",
            "xl": "0.75rem",
            "full": "9999px"
          },
        },
      },
    }
  </script>
<style>
/* Responsive layout: preserve content and keep controls within the viewport. */
:where(main, section, article, aside, header, footer, nav, form, fieldset, .flex > *, .grid > *) { min-width: 0; }
img, video, iframe { max-width: 100%; }
:where(input, select, textarea) { max-width: 100%; }
:where(p, h1, h2, h3, a, label) { overflow-wrap: break-word; }
@media (max-width: 767px) {
  .px-40, .px-20, .px-16, .px-12, .px-10 { padding-left: 1rem !important; padding-right: 1rem !important; }
  [class*="min-w-["] { min-width: 0 !important; }
  table { display: block; max-width: 100%; overflow-x: auto; }
  .toast-notification { max-width: calc(100vw - 2rem); right: 1rem; }
}

/* Tablet navigation, footer wrapping, and decorative accents. */
.material-symbols-outlined { flex-shrink: 0; overflow-wrap: normal; white-space: nowrap; }
footer li, footer a { overflow-wrap: anywhere; }
@media (max-width: 1023px) {
  footer .md\:grid-cols-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .absolute.-right-6 { right: 0; }
}
</style>
<meta name="currency" content="CLP">
</head>

<body class="bg-background-light dark:bg-background-dark font-display text-gray-800 dark:text-gray-200">
  <div class="flex flex-col min-h-screen">
    <header
        class="sticky top-0 z-10 flex items-center justify-between whitespace-nowrap border-b border-primary/20 bg-background-light/80 px-10 py-3 backdrop-blur-sm dark:bg-background-dark/80">
        <div class="flex items-center gap-3">
          <svg class="h-6 w-6 text-primary" fill="none" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
            <path
              d="M42.4379 44C42.4379 44 36.0744 33.9038 41.1692 24C46.8624 12.9336 42.2078 4 42.2078 4L7.01134 4C7.01134 4 11.6577 12.932 5.96912 23.9969C0.876273 33.9029 7.27094 44 7.27094 44L42.4379 44Z"
              fill="currentColor"></path>
          </svg>
          <h2 class="text-lg font-bold">Carnicería El Rancho</h2>
        </div>
        <nav class="hidden items-center gap-8 md:flex" id="navMenu">
          <a class="text-sm font-medium hover:text-primary" href="/template-carniceria-01/">Inicio</a>
          <a class="text-sm font-medium hover:text-primary" href="/template-carniceria-01/productos/">Productos</a>
          <a class="text-sm font-medium hover:text-primary" href="/template-carniceria-01/recetas/">Recetas</a>
          <a class="text-sm font-medium hover:text-primary" href="/template-carniceria-01/nosotros/">Nosotros</a>
          <a class="text-sm font-medium hover:text-primary" href="/template-carniceria-01/contacto/">Contacto</a>
        </nav>
        <button class="md:hidden text-gray-900 dark:text-white" id="btnMenu">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M4 6h16M4 12h16m-7 6h7" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
          </svg>
        </button>
        <div class="flex items-center gap-4">
          <a href="/template-carniceria-01/carrito/"
            class="flex h-10 w-10 cursor-pointer items-center justify-center rounded-full bg-primary/10 text-primary/80 transition-colors hover:bg-primary/20 dark:bg-primary/20 dark:text-primary/90 dark:hover:bg-primary/30">
            <svg fill="currentColor" height="20px" viewBox="0 0 256 256" width="20px"
              xmlns="http://www.w3.org/2000/svg">
              <path
                d="M222.14,58.87A8,8,0,0,0,216,56H54.68L49.79,29.14A16,16,0,0,0,34.05,16H16a8,8,0,0,0,0,16h18L59.56,172.29a24,24,0,0,0,5.33,11.27,28,28,0,1,0,44.4,8.44h45.42A27.75,27.75,0,0,0,152,204a28,28,0,1,0,28-28H83.17a8,8,0,0,1-7.87-6.57L72.13,152h116a24,24,0,0,0,23.61-19.71l12.16-66.86A8,8,0,0,0,222.14,58.87ZM96,204a12,12,0,1,1-12-12A12,12,0,0,1,96,204Zm96,0a12,12,0,1,1-12-12A12,12,0,0,1,192,204Zm4-74.57A8,8,0,0,1,188.1,136H69.22L57.59,72H206.41Z">
              </path>
            </svg>
        </a>
        </div>
      </header>
    <main class="flex-grow flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
      <div
        class="max-w-md w-full space-y-8 bg-background-light dark:bg-background-dark p-8 md:p-10 rounded-xl shadow-lg border border-primary/10 dark:border-primary/20">
        <div>
          <h2 class="mt-6 text-center text-3xl font-extrabold text-gray-900 dark:text-white">Create your account</h2>
          <p class="mt-2 text-center text-sm text-gray-600 dark:text-gray-400">And start enjoying the best cuts.</p>
        </div>
        <form action="#" class="mt-8 space-y-6" method="POST">
          <input name="remember" type="hidden" value="true" />
          <div class="rounded-md shadow-sm -space-y-px">
            <div>
              <label class="sr-only" for="full-name">Full Name</label>
              <input
                class="appearance-none rounded-none relative block w-full px-3 py-3 border border-gray-300 dark:border-gray-700 placeholder-gray-500 dark:placeholder-gray-400 text-gray-900 dark:text-white bg-background-light dark:bg-background-dark rounded-t-lg focus:outline-none focus:ring-primary focus:border-primary focus:z-10 sm:text-sm"
                id="full-name" name="name" placeholder="Full Name" required="" type="text" />
            </div>
            <div>
              <label class="sr-only" for="email-address">Email address</label>
              <input autocomplete="email"
                class="appearance-none rounded-none relative block w-full px-3 py-3 border border-gray-300 dark:border-gray-700 placeholder-gray-500 dark:placeholder-gray-400 text-gray-900 dark:text-white bg-background-light dark:bg-background-dark focus:outline-none focus:ring-primary focus:border-primary focus:z-10 sm:text-sm"
                id="email-address" name="email" placeholder="Email address" required="" type="email" />
            </div>
            <div>
              <label class="sr-only" for="password">Password</label>
              <input autocomplete="current-password"
                class="appearance-none rounded-none relative block w-full px-3 py-3 border border-gray-300 dark:border-gray-700 placeholder-gray-500 dark:placeholder-gray-400 text-gray-900 dark:text-white bg-background-light dark:bg-background-dark rounded-b-lg focus:outline-none focus:ring-primary focus:border-primary focus:z-10 sm:text-sm"
                id="password" name="password" placeholder="Password" required="" type="password" />
            </div>
          </div>
          <div>
            <button
              class="group relative w-full flex justify-center py-3 px-4 border border-transparent text-sm font-bold rounded-lg text-white bg-primary hover:bg-primary/90 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-colors"
              type="submit">
              Sign Up
            </button>
          </div>
          <div class="text-center">
            <a class="font-medium text-sm text-primary hover:text-primary/80" href="#">
              Already have an account? Log in
            </a>
          </div>
        </form>
      </div>
    </main>
  </div>
  <script src="../main.js"></script>
</body>

</html>
